<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-label="Discourse triangle lattice">
  <rect width="720" height="420" fill="#081114"/>
  <text x="36" y="36" fill="#e8ece8" font-family="Fraunces, Times New Roman, serif" font-size="22">Discourse triangle</text>
  <text x="36" y="58" fill="#8a9690" font-family="IBM Plex Sans, sans-serif" font-size="13">Private R² → said R¹ · restriction = projection onto coord 0</text>

  <text x="36" y="96" fill="#5c6864" font-family="IBM Plex Sans, sans-serif" font-size="11">L1 SAID</text>
  <circle cx="360" cy="130" r="16" fill="#6b8ea3"/>
  <circle cx="360" cy="130" r="22" fill="none" stroke="#6b8ea3" stroke-width="1.2" opacity="0.35"/>
  <text x="390" y="126" fill="#e8ece8" font-family="IBM Plex Sans, sans-serif" font-size="14">Public channel</text>
  <text x="390" y="144" fill="#5c6864" font-family="IBM Plex Mono, monospace" font-size="11">dim 1 · free</text>

  <line x1="160" y1="280" x2="360" y2="146" stroke="#c4a574" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="360" y1="280" x2="360" y2="146" stroke="#c4a574" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="560" y1="280" x2="360" y2="146" stroke="#c4a574" stroke-width="2" stroke-dasharray="6 5"/>

  <text x="36" y="250" fill="#5c6864" font-family="IBM Plex Sans, sans-serif" font-size="11">L0 PRIVATE</text>

  <circle cx="160" cy="300" r="18" fill="#4a9a92"/>
  <circle cx="160" cy="300" r="24" fill="none" stroke="#4a9a92" stroke-width="1.6"/>
  <text x="160" y="338" fill="#e8ece8" font-family="IBM Plex Sans, sans-serif" font-size="13" text-anchor="middle">Alice</text>
  <text x="160" y="354" fill="#5c6864" font-family="IBM Plex Mono, monospace" font-size="10" text-anchor="middle">[0.9, 0.8]</text>

  <circle cx="360" cy="300" r="18" fill="#4a9a92"/>
  <circle cx="360" cy="300" r="24" fill="none" stroke="#4a9a92" stroke-width="1.6"/>
  <text x="360" y="338" fill="#e8ece8" font-family="IBM Plex Sans, sans-serif" font-size="13" text-anchor="middle">Bob</text>
  <text x="360" y="354" fill="#5c6864" font-family="IBM Plex Mono, monospace" font-size="10" text-anchor="middle">[0.85, −7.7]</text>

  <circle cx="560" cy="300" r="18" fill="#4a9a92"/>
  <circle cx="560" cy="300" r="24" fill="none" stroke="#4a9a92" stroke-width="1.6"/>
  <text x="560" y="338" fill="#e8ece8" font-family="IBM Plex Sans, sans-serif" font-size="13" text-anchor="middle">Cara</text>
  <text x="560" y="354" fill="#5c6864" font-family="IBM Plex Mono, monospace" font-size="10" text-anchor="middle">[0.1, 0.0]</text>

  <text x="36" y="396" fill="#8a9690" font-family="IBM Plex Sans, sans-serif" font-size="12">size = dim · hue = level · dashed = projection · ring = pinned · Alice/Bob agree in speech, disagree in belief</text>
</svg>
