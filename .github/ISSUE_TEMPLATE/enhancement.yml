name: Enhancement
description: A concrete next step on the lattice, algebra, or datasets
title: "[enh] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - visualization
        - algebra
        - dataset
        - ingest
        - ux
        - tests
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What becomes understandable that is not today?
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Files likely to change
      description: See docs/ARCHITECTURE.md and docs/INGEST.md
      placeholder: src/lib/sheaf/…, schemas/…, templates/library/…
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Definition of done
      description: Screenshot-testable. Include Close-path, energy, and mobile if UI. New graphs must validate and have a catalog row.
    validations:
      required: true
